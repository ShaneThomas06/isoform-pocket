[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "isoform-pocket"
version = "0.1.0"
description = "Uncertainty-aware structural analysis of alternative protein isoforms"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = ["numpy==2.3.5", "matplotlib==3.10.9"]

[project.optional-dependencies]
pockets = ["pyKVFinder==0.9.2"]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
